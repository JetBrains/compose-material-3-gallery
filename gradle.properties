#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.wasm.enabled=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true


#Configurable kotlin versions
kotlin_version=2.0.20-dev-2651
kotlin_repo_url=
kotlin_api_version=2.0
kotlin_language_version=2.0

#Compose versions
composeMpp.version=1.6.10-beta03
#compose.compiler=1.5.4-dev1-kt2.0.0-Beta1
# or full id is valid too:
#compose.compiler=org.jetbrains.compose.compiler:compiler:1.5.4-dev1-kt2.0.0-Beta1
compose.compiler.customRepositoryUrl=