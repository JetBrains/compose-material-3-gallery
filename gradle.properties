#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8g"
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
kotlin.incremental.wasm=true

# TeamCity Configuration: Override Kotlin language version when compiling
#kotlin_language_version=
#kotlin_api_version=
#kotlin_additional_cli_options=

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.wasm.enabled=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true


#Configurable kotlin versions (can be overridden by TeamCity)
#kotlin_version=2.2.20-Beta2
#kotlin_repo_url=
#kotlin_api_version=2.2
#kotlin_language_version=2.2

#Compose versions
composeMpp.version=1.11.0-beta02
compose.compiler.customRepositoryUrl=